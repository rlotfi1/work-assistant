<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work Assistant</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1216'/%3E%3Ccircle cx='16' cy='16' r='4.2' fill='%23f2a444'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f2a444' stroke-width='1.6' opacity='.5'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;                         /* native controls (date/time/select, scrollbars) render dark */
            /* Flight deck — a warm-dark operations console. Amber = signal/brand,
               cyan = status/info, green = nominal/done, red = alert. */
            --ink: #eef3f8; --ink-2: #aeb9c6; --ink-3: #7a8797; --ink-4: #556270;
            --bg: #0f1216; --surface: #171c22; --surface-alt: #1c222a; --surface-2: #232b35;
            --line: #29313b; --line-2: #3a4552;
            --teal: #f2a444; --teal-d: #f6b662; --teal-soft: rgba(242,164,68,.15);   /* amber signal (brand/primary) */
            --navy: #2a3a4d; --gold: #f2a444;
            --urgent: #ff5f56; --urgent-soft: rgba(255,95,86,.14); --amber: #f2a444; --amber-soft: rgba(242,164,68,.14);
            --doing: #48c9e2; --doing-soft: rgba(72,201,226,.14); --done: #43c9a2;    /* cyan status · green nominal */
            --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
            --shadow: 0 10px 30px -14px rgba(0,0,0,.75);
            --shadow-lg: 0 30px 70px -24px rgba(0,0,0,.86);
            --r: 12px; --r-sm: 9px;
            --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
            --display: 'Chakra Petch', 'IBM Plex Sans', sans-serif;
            --mono: 'IBM Plex Mono', ui-monospace, monospace;
        }
        * { box-sizing: border-box; margin: 0; }
        html, body { height: 100%; }
        body { font-family: var(--sans); color: var(--ink); background: var(--bg); font-size: 14.5px; line-height: 1.55; -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(1200px 560px at 84% -12%, rgba(242,164,68,.07), transparent 62%), radial-gradient(860px 480px at -6% 110%, rgba(72,201,226,.05), transparent 60%);
            background-attachment: fixed; }
        ::-webkit-scrollbar { width: 11px; height: 11px; }
        ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid var(--bg); }
        ::-webkit-scrollbar-thumb:hover { background: #47535f; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::selection { background: rgba(242,164,68,.28); }
        button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
        ::selection { background: var(--teal-soft); }

        /* ── shell ── */
        .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
        .rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
        .brand { padding: 20px 20px 14px; }
        .brand .eyebrow { font-family: var(--mono); font-size: .58rem; letter-spacing: .2em; text-transform: uppercase; color: var(--teal-d); }
        .brand h1 { font-family: var(--display); font-weight: 600; font-size: 1.32rem; letter-spacing: -.01em; margin-top: 3px; display: flex; align-items: center; gap: 8px; }
        .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
        .nav { padding: 6px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
        .nav-group { font-family: var(--mono); font-size: .58rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); padding: 14px 10px 5px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: var(--r-sm); cursor: pointer; color: var(--ink-2); font-weight: 500; border: 1px solid transparent; transition: background .13s, color .13s; user-select: none; }
        .nav-item:hover { background: var(--surface-alt); color: var(--ink); }
        .nav-item.active { background: var(--teal-soft); color: var(--teal-d); border-color: color-mix(in srgb, var(--teal) 22%, transparent); font-weight: 600; }
        .nav-item .ni-ico { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
        .nav-item .ni-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-item .ni-count { font-family: var(--mono); font-size: .72rem; font-weight: 600; color: var(--ink-3); background: var(--surface-2); border-radius: 20px; padding: 1px 8px; min-width: 22px; text-align: center; }
        .nav-item.active .ni-count { color: var(--teal-d); background: color-mix(in srgb, var(--teal) 16%, transparent); }
        .nav-item .ni-count.alert { color: #fff; background: var(--urgent); }
        .rail-foot { padding: 12px 18px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: .66rem; color: var(--ink-4); display: flex; align-items: center; gap: 7px; }
        .rail-foot .sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--done); transition: background .2s; }
        .rail-foot.saving .sdot { background: var(--amber); }
        .rail-foot.error .sdot { background: var(--urgent); }

        .main { display: flex; flex-direction: column; min-width: 0; }
        .topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(9px); border-bottom: 1px solid var(--line); padding: 14px 30px; }
        .view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
        .view-head h2 { font-family: var(--display); font-weight: 600; font-size: 1.5rem; letter-spacing: -.015em; }
        .view-head .vh-sub { color: var(--ink-3); font-size: .84rem; margin-top: 1px; }

        /* ── capture bar ── */
        .capture { display: flex; flex-direction: column; gap: 8px; }
        .cap-row { display: flex; gap: 10px; align-items: stretch; }
        .seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-sm); padding: 3px; gap: 2px; flex-shrink: 0; }
        .seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 7px; font-weight: 600; font-size: .82rem; color: var(--ink-3); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all .13s; }
        .seg button.on { background: var(--surface); color: var(--teal-d); box-shadow: var(--shadow-sm); }
        .cap-input-wrap { position: relative; flex: 1; display: flex; }
        .cap-input { flex: 1; border: 1.5px solid var(--line-2); background: var(--surface); border-radius: var(--r); padding: 12px 15px; font-size: .95rem; transition: border-color .15s, box-shadow .15s; }
        .cap-input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
        .cap-add { border: 0; background: linear-gradient(180deg, var(--teal), var(--teal-d)); color: #fff; font-weight: 600; padding: 0 20px; border-radius: var(--r); cursor: pointer; flex-shrink: 0; box-shadow: 0 8px 18px -9px var(--teal-d); transition: transform .12s, box-shadow .15s, opacity .15s; }
        .cap-add:hover { transform: translateY(-1px); }
        .cap-add:active { transform: translateY(0); }
        .cap-add:disabled { opacity: .5; cursor: default; transform: none; }
        .cap-extra { display: flex; gap: 10px; }
        .cap-extra input { flex: 1; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 9px 12px; font-size: .86rem; }
        .cap-extra input:focus { outline: none; border-color: var(--teal); }
        .cap-hint { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 22px; }
        .cap-hint .htxt { font-family: var(--mono); font-size: .68rem; color: var(--ink-4); }
        .cap-hint .htxt b { color: var(--ink-3); font-weight: 600; }
        .chip { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: var(--surface-2); color: var(--ink-2); }
        .chip.req { background: var(--doing-soft); color: var(--doing); }
        .chip.proj { background: var(--teal-soft); color: var(--teal-d); }
        .chip.due { background: var(--amber-soft); color: var(--amber); }
        .chip.pri-urgent { background: var(--urgent-soft); color: var(--urgent); }
        .chip.pri-high { background: var(--amber-soft); color: var(--amber); }

        /* ── content ── */
        .content { padding: 22px 30px 60px; max-width: 1120px; }
        .section-label { font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 22px 4px 10px; display: flex; align-items: center; gap: 9px; }
        .section-label:first-child { margin-top: 0; }
        .section-label .sl-count { color: var(--ink-4); }
        .section-label .sl-line { flex: 1; height: 1px; background: var(--line); }
        .section-label.danger { color: var(--urgent); }

        /* task card */
        .tlist { display: flex; flex-direction: column; gap: 8px; }
        .task { display: flex; align-items: flex-start; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow-sm); transition: border-color .13s, box-shadow .13s, transform .08s; cursor: pointer; }
        .task:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
        .task.pri-urgent { border-left: 3px solid var(--urgent); }
        .task.pri-high { border-left: 3px solid var(--amber); }
        .task.done { opacity: .58; }
        .task.done .t-title { text-decoration: line-through; text-decoration-color: var(--ink-4); }
        .check { flex-shrink: 0; width: 21px; height: 21px; border-radius: 7px; border: 1.8px solid var(--line-2); background: var(--surface); cursor: pointer; margin-top: 1px; display: grid; place-items: center; transition: all .13s; }
        .check:hover { border-color: var(--teal); }
        .check.on { background: var(--teal); border-color: var(--teal); }
        .check svg { width: 13px; height: 13px; color: #fff; opacity: 0; transform: scale(.6); transition: all .13s; }
        .check.on svg { opacity: 1; transform: scale(1); }
        .t-body { flex: 1; min-width: 0; }
        .t-title { font-weight: 500; color: var(--ink); word-break: break-word; }
        .t-meta { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 6px; align-items: center; }
        .tag { display: inline-flex; align-items: center; gap: 4px; font-size: .71rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-3); white-space: nowrap; }
        .tag svg { width: 11px; height: 11px; }
        .tag.req { background: var(--doing-soft); color: var(--doing); }
        .tag.proj { background: var(--teal-soft); color: var(--teal-d); }
        .tag.src-email { background: #efe8fb; color: #7c5cd6; }
        .tag.src-meeting { background: #fbecd9; color: #b9863f; }
        .tag.due { background: var(--surface-2); color: var(--ink-2); }
        .tag.due.over { background: var(--urgent-soft); color: var(--urgent); }
        .tag.due.today { background: var(--amber-soft); color: var(--amber); }
        .tag.link { cursor: pointer; }
        .tag.link:hover { text-decoration: underline; }
        .t-status { flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
        .t-edit { border: 0; background: transparent; color: var(--ink-4); width: 28px; height: 28px; border-radius: 7px; cursor: pointer; display: grid; place-items: center; opacity: 0; transition: opacity .13s, background .13s, color .13s; }
        .t-edit svg { width: 15px; height: 15px; }
        .task:hover .t-edit { opacity: 1; }
        .t-edit:hover { background: var(--surface-2); color: var(--teal-d); }
        @media (hover: none) { .t-edit { opacity: .7; } }
        .pill { border: 1px solid var(--line-2); background: var(--surface); border-radius: 20px; padding: 4px 11px; font-size: .72rem; font-weight: 600; cursor: pointer; color: var(--ink-2); white-space: nowrap; transition: all .12s; }
        .pill:hover { border-color: var(--ink-3); }
        .pill.doing { background: var(--doing-soft); color: var(--doing); border-color: transparent; }
        .pill.done { background: var(--teal-soft); color: var(--teal-d); border-color: transparent; }

        .empty { text-align: center; padding: 46px 20px; color: var(--ink-3); }
        .empty .e-emoji { font-size: 2rem; }
        .empty h3 { font-family: var(--display); font-weight: 600; font-size: 1.15rem; color: var(--ink-2); margin: 8px 0 4px; }

        /* board */
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
        .col { background: var(--surface-alt); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-height: 120px; }
        .col.dragover { border-color: var(--teal); background: var(--teal-soft); }
        .col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 3px; }
        .col-head .ch-name { font-weight: 700; font-size: .82rem; display: flex; align-items: center; gap: 7px; }
        .col-head .ch-dot { width: 8px; height: 8px; border-radius: 50%; }
        .col.todo .ch-dot { background: var(--ink-4); } .col.doing .ch-dot { background: var(--doing); } .col.done .ch-dot { background: var(--done); }
        .col-head .ch-count { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }
        .col .task { cursor: grab; margin-bottom: 8px; }
        .col .task:active { cursor: grabbing; }
        .col .tlist { min-height: 30px; }

        /* filters */
        .filters { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
        .filters input[type=text], .filters select { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 8px 11px; font-size: .84rem; }
        .filters input[type=text] { min-width: 200px; flex: 1; max-width: 340px; }
        .filters input:focus, .filters select:focus { outline: none; border-color: var(--teal); }
        .fclear { border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: .8rem; text-decoration: underline; }

        /* meetings */
        .mtg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); margin-bottom: 14px; overflow: hidden; }
        .mtg-head { padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .mtg-head:hover { background: var(--surface-alt); }
        .mtg-head .mh-name { font-family: var(--display); font-weight: 600; font-size: 1.05rem; flex: 1; }
        .mtg-head .mh-date { font-family: var(--mono); font-size: .74rem; color: var(--ink-3); }
        .mtg-head .mh-count { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); background: var(--surface-2); border-radius: 20px; padding: 2px 9px; }
        .mtg-body { padding: 4px 16px 16px; border-top: 1px solid var(--line); }
        .mtg-notes { width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; font-size: .86rem; background: var(--surface-alt); resize: vertical; min-height: 52px; margin: 12px 0; }
        .mtg-notes:focus { outline: none; border-color: var(--teal); background: var(--surface); }
        .mi-add { display: flex; gap: 8px; margin-top: 10px; }
        .mi-add input { flex: 1; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 9px 12px; font-size: .86rem; }
        .mi-add input:focus { outline: none; border-color: var(--teal); }

        /* My day — daily activity tracker */
        .day-nav { display: inline-flex; gap: 6px; }
        .day-nav .btn { min-width: 34px; }
        .day-log { display: flex; gap: 10px; margin-bottom: 20px; }
        .day-input { flex: 1; border: 1.5px solid var(--line-2); background: var(--surface); border-radius: var(--r); padding: 12px 15px; font-size: .92rem; transition: border-color .15s, box-shadow .15s; }
        .day-input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
        .day-log .btn { display: inline-flex; align-items: center; gap: 6px; }
        .day-log .btn svg { width: 14px; height: 14px; }
        .day-readonly { background: var(--surface-alt); border: 1px dashed var(--line-2); border-radius: var(--r); padding: 12px 15px; color: var(--ink-3); font-size: .86rem; margin-bottom: 20px; }
        .timeline { position: relative; padding-left: 6px; }
        .timeline::before { content: ''; position: absolute; left: 123px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
        .tl-item { position: relative; display: grid; grid-template-columns: 106px 30px 1fr auto; align-items: center; gap: 10px; padding: 9px 4px; border-radius: var(--r-sm); }
        .tl-item[data-open] { cursor: pointer; }
        .tl-item[data-open]:hover { background: var(--surface-alt); }
        .tl-time { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); text-align: right; }
        .tl-timeedit { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 4px; width: 100%; cursor: pointer; transition: border-color .12s, background .12s, color .12s; }
        .tl-timeedit:hover { border-color: var(--line-2); background: var(--surface); color: var(--ink-2); }
        .tl-timeedit:focus { outline: none; border-color: var(--teal); background: var(--surface); color: var(--ink); box-shadow: 0 0 0 3px var(--teal-soft); }
        .tl-timeedit::-webkit-calendar-picker-indicator { opacity: .35; cursor: pointer; }
        .tl-timeedit:hover::-webkit-calendar-picker-indicator { opacity: .7; }
        .tl-mark { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-2); display: grid; place-items: center; color: var(--ink-3); z-index: 1; }
        .tl-mark svg { width: 15px; height: 15px; }
        .tl-mark.done { background: var(--teal); border-color: var(--teal); color: #fff; }
        .tl-body { color: var(--ink); font-size: .9rem; min-width: 0; }
        .tl-tag { display: inline-block; font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 7px; border-radius: 5px; margin-right: 7px; background: var(--surface-2); color: var(--ink-3); }
        .tl-tag.done { background: var(--teal-soft); color: var(--teal-d); }
        .tl-req { color: var(--ink-3); font-size: .82rem; margin-left: 6px; }
        .tl-mins { font-family: var(--mono); font-size: .7rem; color: var(--ink-3); background: var(--surface-2); border-radius: 20px; padding: 1px 8px; margin-left: 8px; }
        .tl-del { border: 0; background: transparent; color: var(--ink-4); font-size: 1.1rem; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; opacity: 0; transition: all .13s; }
        .tl-item:hover .tl-del { opacity: 1; }
        .tl-del:hover { background: var(--urgent-soft); color: var(--urgent); }

        .btn { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); border-radius: var(--r-sm); padding: 8px 13px; font-weight: 600; font-size: .82rem; cursor: pointer; transition: all .13s; }
        .btn:hover { border-color: var(--ink-3); color: var(--ink); }
        .btn.primary { background: linear-gradient(180deg, var(--teal), var(--teal-d)); color: #fff; border-color: transparent; box-shadow: 0 8px 18px -10px var(--teal-d); }
        .btn.primary:hover { color: #fff; transform: translateY(-1px); }
        .btn.ghost { border-color: transparent; background: transparent; }
        .btn.danger { color: var(--urgent); }
        .btn.danger:hover { border-color: var(--urgent); background: var(--urgent-soft); }
        .btn.sm { padding: 5px 10px; font-size: .76rem; }

        /* modal (task detail) */
        .overlay { position: fixed; inset: 0; background: rgba(18,30,24,.44); backdrop-filter: blur(3px); display: none; align-items: flex-start; justify-content: center; padding: 60px 20px; z-index: 60; }
        .overlay.open { display: flex; }
        .modal { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); width: 100%; max-width: 540px; overflow: hidden; animation: pop .16s ease; }
        @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
        .modal-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
        .modal-head h3 { font-family: var(--display); font-weight: 600; font-size: 1.16rem; flex: 1; }
        .modal-x { border: 0; background: var(--surface-2); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: var(--ink-3); font-size: 1.1rem; }
        .modal-x:hover { background: var(--line); color: var(--ink); }
        .modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; max-height: 62vh; overflow-y: auto; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
        .field input, .field select, .field textarea { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 9px 12px; font-size: .9rem; }
        .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
        .field textarea { resize: vertical; min-height: 64px; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
        .modal-foot .spacer { flex: 1; }
        /* task activity log */
        .tlog { display: flex; flex-direction: column; gap: 2px; max-height: 200px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px; background: var(--surface-alt); }
        .tlog-empty { color: var(--ink-3); font-size: .82rem; padding: 10px 8px; }
        .tlog-item { display: grid; grid-template-columns: 16px 1fr auto; align-items: start; gap: 9px; padding: 7px 8px; border-radius: 7px; }
        .tlog-item:hover { background: var(--surface); }
        .tlog-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); margin-top: 5px; }
        .tlog-item.system .tlog-dot { background: var(--ink-4); }
        .tlog-main { min-width: 0; }
        .tlog-text { font-size: .86rem; color: var(--ink); word-break: break-word; }
        .tlog-item.system .tlog-text { color: var(--ink-2); font-family: var(--mono); font-size: .78rem; }
        .tlog-when { font-family: var(--mono); font-size: .66rem; color: var(--ink-4); margin-top: 2px; }
        .tlog-del { border: 0; background: transparent; color: var(--ink-4); font-size: 1rem; width: 22px; height: 22px; border-radius: 5px; cursor: pointer; opacity: 0; transition: all .12s; }
        .tlog-item:hover .tlog-del { opacity: 1; }
        .tlog-del:hover { background: var(--urgent-soft); color: var(--urgent); }
        .tlog-add { display: flex; gap: 8px; margin-top: 8px; }
        .tlog-add input { flex: 1; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 9px 12px; font-size: .86rem; }
        .tlog-add input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }

        .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 30px; font-size: .84rem; font-weight: 500; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: all .22s; z-index: 90; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast .undo { margin-left: 12px; color: var(--teal-soft); font-weight: 700; cursor: pointer; pointer-events: auto; }

        .reminder-cta { display: inline-flex; align-items: center; gap: 7px; }

        @media (max-width: 820px) {
            .app { grid-template-columns: 1fr; }
            .rail { position: fixed; z-index: 50; width: 248px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow-lg); }
            .rail.open { transform: translateX(0); }
            .board { grid-template-columns: 1fr; }
            .content, .topbar { padding-left: 16px; padding-right: 16px; }
            .menu-toggle { display: inline-flex !important; }
        }
        .menu-toggle { display: none; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; }

        /* ════ FLIGHT DECK — signature & instrument details ════ */
        /* Display type: HUD-tight tracking on headings */
        .view-head h2, .modal-head h3, .empty h3 { letter-spacing: .01em; font-weight: 600; }
        .brand h1 { letter-spacing: .01em; }

        /* Amber primary controls carry dark ink for legibility + a signal glow */
        .cap-add, .btn.primary { color: #17120a; font-weight: 700; }
        .cap-add:hover, .btn.primary:hover { color: #17120a; }
        .cap-add { box-shadow: 0 0 20px -5px rgba(242,164,68,.55); }
        .btn.primary { box-shadow: 0 0 16px -6px rgba(242,164,68,.5); }

        /* Done = green (nominal), kept distinct from the amber signal */
        .check.on { background: var(--done); border-color: var(--done); }
        .pill.done { background: rgba(67,201,162,.15); color: var(--done); }
        .tl-tag.done { background: rgba(67,201,162,.16); color: var(--done); }
        .tl-mark.done { background: var(--done); border-color: var(--done); color: #08130f; box-shadow: 0 0 0 4px var(--bg), 0 0 12px 0 rgba(67,201,162,.5); }

        /* Source readout chips, re-toned for the dark deck */
        .tag.src-email { background: rgba(139,152,255,.16); color: #a6b2ff; }
        .tag.src-meeting { background: rgba(242,164,68,.16); color: var(--teal-d); }

        /* Live status lights */
        .brand .dot { box-shadow: 0 0 0 4px rgba(242,164,68,.14), 0 0 12px 1px rgba(242,164,68,.55); }
        .rail-foot .sdot { box-shadow: 0 0 9px 0 currentColor; }
        .nav-item .ni-count.alert { box-shadow: 0 0 10px -1px rgba(255,95,86,.7); }

        /* Active nav = amber signal bar on the module edge */
        .nav-item.active { position: relative; }
        .nav-item.active::before { content: ''; position: absolute; left: -12px; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: var(--teal); box-shadow: 0 0 10px 0 rgba(242,164,68,.65); }

        /* Topbar signal hairline */
        .topbar::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, var(--teal), transparent 44%); opacity: .6; }

        /* SIGNATURE — My-day telemetry tape: a glowing running spine with signal nodes */
        .timeline::before { background: linear-gradient(180deg, var(--teal), rgba(242,164,68,.12)); width: 2px; box-shadow: 0 0 12px 0 rgba(242,164,68,.28); }
        .tl-mark { background: var(--surface); border-color: var(--line-2); box-shadow: 0 0 0 4px var(--bg); }
        .tl-mark svg { color: var(--teal); }
        .tl-time { letter-spacing: .02em; }

        /* Task priority = signal bars */
        .task { position: relative; }
        .task.pri-urgent { border-left-color: var(--urgent); box-shadow: inset 2px 0 10px -6px var(--urgent), var(--shadow-sm); }
        .task.pri-high { border-left-color: var(--amber); box-shadow: inset 2px 0 10px -6px var(--amber), var(--shadow-sm); }

        /* Reduced-motion & focus floor */
        @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
        :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

        /* Account row in the rail */
        .rail-acct { padding: 10px 18px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
        .rail-acct .ra-email { flex: 1; min-width: 0; font-family: var(--mono); font-size: .68rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rail-acct .ra-signout { border: 1px solid var(--line-2); background: transparent; color: var(--ink-3); border-radius: 7px; padding: 4px 9px; font-size: .72rem; font-weight: 600; cursor: pointer; transition: all .13s; }
        .rail-acct .ra-signout:hover { border-color: var(--urgent); color: var(--urgent); background: var(--urgent-soft); }

        /* Login gate */
        .auth-gate { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: var(--bg);
            background-image: radial-gradient(1000px 520px at 82% -12%, rgba(242,164,68,.10), transparent 62%), radial-gradient(760px 460px at -6% 110%, rgba(72,201,226,.06), transparent 60%); }
        .auth-gate[hidden] { display: none; }
        .auth-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 30px 28px 26px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }
        .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--teal), transparent 55%); }
        .auth-eyebrow { font-family: var(--mono); font-size: .58rem; letter-spacing: .2em; text-transform: uppercase; color: var(--teal-d); }
        .auth-brand { font-family: var(--display); font-weight: 600; font-size: 1.5rem; letter-spacing: .01em; display: flex; align-items: center; gap: 9px; margin-top: 4px; }
        .auth-brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px rgba(242,164,68,.14), 0 0 12px 1px rgba(242,164,68,.55); }
        .auth-sub { color: var(--ink-3); font-size: .84rem; margin: 8px 0 18px; }
        .auth-fields[hidden] { display: none; }
        .auth-fields label { display: block; font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 12px 2px 6px; }
        .auth-fields input { width: 100%; border: 1px solid var(--line-2); background: var(--surface-alt); color: var(--ink); border-radius: var(--r-sm); padding: 11px 13px; font-size: .92rem; transition: border-color .15s, box-shadow .15s; }
        .auth-fields input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
        .auth-fields #authBtn { width: 100%; margin-top: 20px; border: 0; border-radius: var(--r-sm); padding: 12px; font-weight: 700; font-size: .92rem; color: #17120a; cursor: pointer;
            background: linear-gradient(180deg, var(--teal), var(--teal-d)); box-shadow: 0 0 20px -5px rgba(242,164,68,.55); transition: transform .12s, opacity .15s; }
        .auth-fields #authBtn:hover { transform: translateY(-1px); }
        .auth-fields #authBtn:disabled { opacity: .6; cursor: default; transform: none; }
        .auth-err { margin-top: 14px; font-size: .82rem; color: var(--urgent); background: var(--urgent-soft); border: 1px solid rgba(255,95,86,.3); border-radius: 9px; padding: 9px 12px; }
        .auth-err[hidden] { display: none; }

        /* Narrow screens: let the capture row wrap so the Add button never clips */
        @media (max-width: 720px) {
            .cap-row { flex-wrap: wrap; }
            .seg { order: 1; }
            .cap-input-wrap { order: 2; flex: 1 1 100%; }
            .cap-add { order: 3; flex: 0 0 auto; padding: 11px 22px; }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <aside class="rail" id="rail">
            <div class="brand">
                <div class="eyebrow">Personal Work Assistant</div>
                <h1><span class="dot"></span> Assistant</h1>
            </div>
            <nav class="nav" id="nav"></nav>
            <div class="rail-acct" id="railAcct" hidden>
                <span class="ra-email" id="raEmail" title=""></span>
                <button class="ra-signout" id="raSignout" title="Sign out">Sign out</button>
            </div>
            <div class="rail-foot" id="railFoot"><span class="sdot"></span><span id="saveLabel">Saved</span></div>
        </aside>
        <main class="main">
            <header class="topbar">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
                    <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
                    <div class="view-head" style="flex:1;margin-bottom:0">
                        <div>
                            <h2 id="viewTitle">Today</h2>
                            <div class="vh-sub" id="viewSub"></div>
                        </div>
                        <div id="viewActions"></div>
                    </div>
                </div>
                <div class="capture" id="capture"></div>
            </header>
            <div class="content" id="content"></div>
        </main>
    </div>
    <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
    <div class="toast" id="toast"></div>

    <!-- Login gate — covers the app until signed in -->
    <div class="auth-gate" id="authGate">
        <form class="auth-card" id="authForm">
            <div class="auth-eyebrow">Personal Work Assistant</div>
            <div class="auth-brand"><span class="dot"></span> Assistant</div>
            <div class="auth-sub" id="authSub">Checking your session…</div>
            <div class="auth-fields" id="authFields" hidden>
                <label for="authEmail">Email</label>
                <input type="email" id="authEmail" autocomplete="username" required>
                <label for="authPass">Password</label>
                <input type="password" id="authPass" autocomplete="current-password" required>
                <button type="submit" id="authBtn">Sign in</button>
                <div class="auth-err" id="authErr" hidden></div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=20260908i"></script>
    <script src="app.js?v=20260908i"></script>
</body>
</html>
